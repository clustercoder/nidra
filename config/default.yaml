# NIDRA — single source of truth for backend tunables.
# Nothing here may be hardcoded in a script. Env overrides use the NIDRA_ prefix
# (see nidra_common/config.py).

# Deployment environment. `dev` relaxes the API rate limits (see api.rate_limit) so a
# development machine and the test suite are not throttled; compose sets NIDRA_ENV=prod.
env: dev

# --- world-model geometry (must match the trained artifacts) ---
window_delta: 30        # seconds per window
context_L: 30           # windows of history fed to the encoder (15 min)
horizon_K: 6            # windows forecast forward (3 min)
n_features: 45          # len(FEATURE_ORDER)

# --- risk / episode semantics ---
risk_threshold: 0.75
lead_time_m: 2          # consecutive windows above threshold before a crossing counts
episode_close_after: 4  # windows below threshold before an episode closes

predictor:
  impl: stub            # stub | nidra
  # Only read when impl == nidra; the stub needs no artifacts. Relative paths resolve
  # against the repo root, as everywhere else in this file.
  weights_dir: artifacts/weights
  scaler_path: artifacts/scaler/robust_scaler.joblib
  # A DIFFERENT file from this one, deliberately: NidraPredictor needs the nested
  # training/model/rollout config nidra.utils.config.load_config() reads (cfg["model"],
  # cfg["ensemble"], cfg["rollout"], ...), not this file's flat backend tunables. The two
  # configs serve two different consumers and are not meant to be merged into one schema.
  config_path: config/ml_mvp_2017.yaml

# Host-side URLs: docker compose publishes redis and postgres on the NIDRA port block
# (DECISIONS.md D14). In-container services get NIDRA_REDIS_URL / NIDRA_POSTGRES_URL
# pointing at the standard ports on the compose network.
redis:
  url: redis://localhost:6389/0
  # The logical database the test suite runs against (tests/conftest.py). Since P11 the
  # compose workers are always up on database 0, and a suite sharing that bus would have
  # its jobs consumed by a container that cannot see the host paths they name.
  test_db: 1

postgres:
  url: postgresql+asyncpg://nidra:nidra@localhost:5442/nidra

auth:
  access_ttl_min: 30
  refresh_ttl_days: 7
  algorithm: HS256

ingest:
  max_upload_mb: 2048
  allowed_ext: [.pcap, .pcapng, .csv]
  # Where validated uploads land: {upload_dir}/{tenant_id}/{job_id}/{job_id}{ext}.
  # Relative paths resolve against the repo root; NIDRA_UPLOAD_DIR overrides (compose
  # points it at the shared `uploads` volume mounted by api and ingest).
  upload_dir: data/uploads
  csv_chunk_rows: 5000
  tshark_bin: tshark

features:
  # A silent host still has state, so gaps are filled with is_active=0 rows. Past this
  # many consecutive silent windows the host is treated as a fresh sequence instead —
  # that long a gap is a stream restart, not a quiet network, and a wall of zeros would
  # drag every delta and slope through it.
  max_gap_windows: 40
  # `neighbour_risk_fraction` is a heuristic prior, never model output: a peer counts as
  # elevated when its out-degree in the *previous* window reached this.
  elevated_fanout: 5
  # `local_clustering_coeff` neighbourhood sampling cap (IMPLEMENTATION-ML.md §2.7).
  clustering_degree_cap: 200
  # Watchdog grace = 2 * window_delta / replay speed, never below this many seconds.
  # Without it the last window of a capture never closes and the demo's final forecast
  # never fires.
  watchdog_floor_s: 2.0

replay:
  # 60x: one 30 s window every 0.5 s. 0 disables pacing (publish as fast as possible).
  default_speed: 60.0

api:
  # Read-endpoint pagination: the page size used when a request does not name one, and
  # the ceiling a client may ask for (a larger `limit` is clamped, never refused).
  page_limit: 50
  max_page_limit: 500
  # WebSocket fan-out. Each socket owns a queue of this many forecasts and drops its
  # oldest when full — a stalled browser tab must not slow delivery to every other one.
  ws_queue_size: 512
  # Heartbeat: a ping after this long with nothing to send, and close once this many
  # pings have gone unanswered. Idle proxies drop a quiet socket at about 60 s.
  ws_ping_interval_s: 30
  ws_max_missed_pongs: 2
  # Rate limiting (IMPLEMENTATION-Backend.md §8): a Redis sliding window keyed on the
  # caller's tenant, or on its address before a token exists. `/health` and `/metrics`
  # are exempt — a compose healthcheck must never be throttled. Under NIDRA_ENV=dev both
  # ceilings are multiplied by `dev_multiplier`, which keeps the code path exercised
  # while putting the limit out of reach of development and the test suite.
  rate_limit:
    enabled: true
    dev_multiplier: 1000
    general:
      limit: 100
      window_s: 60
    ingest:
      limit: 5
      window_s: 3600
  # Backpressure (§7): the api samples every consumer group's XPENDING on this interval
  # and warns once a count has risen at every sample for `backlog_warn_after_s`. One
  # sample is noise; half a minute of monotone growth is a stage falling behind.
  backlog_poll_s: 5
  backlog_warn_after_s: 30
  # Where `/api/v1/benchmarks` reads evaluation results from. Every `*.json` under it is
  # served verbatim; an empty directory answers "pending" rather than a fabricated
  # number. Relative paths resolve against the repo root, as everywhere else here.
  metrics_dir: artifacts/metrics

streams:
  raw_events: raw_events
  state_vectors: state_vectors
  forecasts: forecasts
  ingest_jobs: ingest_jobs
  maxlen: 100000

# `make demo` / `make e2e-fast`: the seeded account and the prepared capture they replay.
# The password is a local demo credential and the tenant holds nothing but fixture data.
demo:
  email: demo@nidra.local
  password: nidra-demo-please-change
  org_name: NIDRA Demo SOC
  fixture: tests/fixtures/replay.csv
  # 60x: the pace the console was designed to be watched at. 600x is the CI variant.
  speed: 60
  fast_speed: 600
