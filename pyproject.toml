[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nidra-backend"
version = "0.1.0"
description = "NIDRA serving plane — ingest, streaming, inference orchestration, API, persistence"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "redis>=5",
    "asyncpg",
    "sqlalchemy>=2",
    "alembic",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "pyyaml",
    "pandas",
    "pyarrow",
    "numpy",
    "httpx",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
]

[tool.setuptools]
packages = [
    "api",
    "nidra",
    "nidra.data",
    "nidra.serve",
    "nidra_common",
    "services",
    "services.features",
    "services.inference",
    "services.ingest",
    "services.persister",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end test requiring the full docker compose stack",
]
