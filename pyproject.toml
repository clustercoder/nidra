[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nidra-backend"
version = "0.1.0"
description = "NIDRA serving plane — ingest, streaming, inference orchestration, API, persistence"
# Widened from the backend-only <3.12 ceiling: the ML package (nidra.models/train/eval/
# explain) has been developed and tested against 3.13, and both halves now share one
# install.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "redis>=5",
    "asyncpg",
    "sqlalchemy[asyncio]>=2",
    "alembic",
    "python-jose[cryptography]",
    "bcrypt>=4",
    "python-multipart",
    "pyyaml",
    "pandas",
    "pyarrow",
    "numpy",
    "httpx",
    "websockets",
    # --- ML (nidra.models/train/eval/explain/serve) ---
    "torch>=2.4",
    "scikit-learn",
    "shap",
    "captum",
    "matplotlib",
    "tqdm",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
]

[tool.setuptools]
packages = [
    "api",
    "nidra",
    "nidra.data",
    "nidra.serve",
    # ML implementation: nidra.serve.predictor imports these internally, but no service
    # or API module may import them directly — services/inference/predictor_loader.py's
    # own docstring states the boundary: the day a service imports nidra.models, the
    # boundary that keeps the model swappable is gone.
    "nidra.models",
    "nidra.train",
    "nidra.eval",
    "nidra.explain",
    "nidra.scripts",
    "nidra.utils",
    "nidra_common",
    "services",
    "services.features",
    "services.inference",
    "services.ingest",
    "services.persister",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end test requiring the full docker compose stack",
]
