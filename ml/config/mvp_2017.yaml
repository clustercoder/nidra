# NIDRA ML — MVP-scale config. Same real dataset and paths as
# config/default.yaml (the complete CIC-IDS2017 dataset, not a truncated
# slice), but a single seed and a reduced epoch budget so a full
# train -> eval run finishes in a practical time for a hackathon deadline.
# config/default.yaml is the full-scale config (5-seed ensemble, 60/30
# epochs) to switch to later — same `dataset:` section, so no data
# re-processing is needed to go from this file to that one.

version: "0.1.0-mvp2017"
schema_version: "1.0"
random_seed: 1337

dataset:
  cic2017_flow_dir: "~/nidra/cicids2017/csv/extracted/TrafficLabelling "
  packets_dir: "~/nidra/cicids2017/pcap/parquet"

  days:
    monday: {file: "Monday-WorkingHours.pcap_ISCX.csv", role: benign_baseline, packets: "Monday-WorkingHours_packets.parquet"}
    tuesday: {file: "Tuesday-WorkingHours.pcap_ISCX.csv", role: train}
    wednesday: {file: "Wednesday-workingHours.pcap_ISCX.csv", role: train}
    thursday_web: {file: "Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv", role: holdout}
    thursday_infiltration: {file: "Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv", role: holdout}
    friday_morning: {file: "Friday-WorkingHours-Morning.pcap_ISCX.csv", role: test, packets: "Friday-WorkingHours_packets.parquet"}
    friday_portscan: {file: "Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv", role: test, packets: "Friday-WorkingHours_packets.parquet"}
    friday_ddos: {file: "Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv", role: test, packets: "Friday-WorkingHours_packets.parquet"}

windowing:
  window_seconds: 30
  context_length: 30
  horizon_length: 6
  min_windows_per_host: 36
  clustering_degree_cap: 200

normalization:
  method: robust_scaler
  clip_min: -10.0
  clip_max: 10.0
  fit_split: train

labels:
  risk_threshold_windows: 6

splits:
  train_days: [monday, tuesday, wednesday]
  test_days: [friday_morning, friday_portscan, friday_ddos]
  holdout_days: [thursday_web, thursday_infiltration]
  val_fraction_of_train_time: 0.15

model:
  n_features: 45
  encoder: {hidden_size: 128, num_layers: 2, dropout: 0.1}
  transition: {mlp_hidden: 256, logvar_min: -6.0, logvar_max: 3.0, state_clamp: 10.0}
  risk_head: {hidden: 64}
  stage_head: {hidden: 64, n_stages: 6}

# MVP-scale training knobs — the only section that differs materially from
# config/default.yaml. Sample counts are capped via --max-train-samples /
# --max-val-samples / --max-eval-samples at the CLI level (stratified by
# risk_label — see nidra.data.dataset.subsample_stratified_by_risk), not by
# truncating the raw CSVs, so the full real dataset is read and windowed;
# only the tensor-construction step is capped for tractability.
train_dynamics:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 20
  grad_clip: 1.0
  scheduler: cosine
  early_stopping_metric: val_multistep_nll
  patience: 6
  horizon_discount: 0.85
  teacher_forcing: {start_p: 1.0, end_p: 0.3, anneal_fraction_of_epochs: 0.6}

train_heads:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 20
  grad_clip: 1.0
  patience: 6

ensemble:
  seeds: [0]   # MVP: single seed, not the production 5-member ensemble

rollout:
  n_samples_per_member: 30
  stochastic: true
  ci_low_quantile: 0.05
  ci_high_quantile: 0.95

serving:
  torch_num_threads: 2
  latency_target_ms: 300

eval:
  risk_threshold: 0.75
  lead_time_persistence_windows: 2
  window_seconds: 30

explain:
  shap_background_centroids: 100
  shap_background_source: benign_train

artifacts:
  root: "artifacts_mvp_2017"
  weights_dir: "artifacts_mvp_2017/weights"
  scaler_dir: "artifacts_mvp_2017/scaler"
  metrics_dir: "artifacts_mvp_2017/metrics"
  processed_dir: "artifacts_mvp_2017/processed"
