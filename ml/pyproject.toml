[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nidra"
version = "0.1.0"
description = "NIDRA (Network Infiltration & Dynamics Recurrent Analyzer for Attack Forecasting) — ML subsystem"
requires-python = ">=3.11"
# Kept in sync with requirements.txt, which additionally records the exact
# versions every committed number was produced with.
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "captum>=0.7",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["nidra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
