version: 0.1.0
schema_version: '1.0'
random_seed: 1337
dataset:
  cic2017_flow_dir: '~/nidra/cicids2017/csv/extracted/TrafficLabelling '
  packets_dir: ~/nidra/cicids2017/pcap/parquet
  days:
    monday:
      file: Monday-WorkingHours.pcap_ISCX.csv
      role: benign_baseline
      packets: Monday-WorkingHours_packets.parquet
    tuesday:
      file: Tuesday-WorkingHours.pcap_ISCX.csv
      role: train
      packets: Tuesday-WorkingHours_packets.parquet
    wednesday:
      file: Wednesday-workingHours.pcap_ISCX.csv
      role: train
      packets: Wednesday-workingHours_packets.parquet
    thursday_web:
      file: Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv
      role: holdout
      packets: Thursday-WorkingHours_packets.parquet
    thursday_infiltration:
      file: Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv
      role: holdout
      packets: Thursday-WorkingHours_packets.parquet
    friday_morning:
      file: Friday-WorkingHours-Morning.pcap_ISCX.csv
      role: test
      packets: Friday-WorkingHours_packets.parquet
    friday_portscan:
      file: Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv
      role: test
      packets: Friday-WorkingHours_packets.parquet
    friday_ddos:
      file: Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv
      role: test
      packets: Friday-WorkingHours_packets.parquet
windowing:
  window_seconds: 60
  context_length: 15
  horizon_length: 3
  min_windows_per_host: 18
  clustering_degree_cap: 200
normalization:
  method: robust_scaler
  clip_min: -10.0
  clip_max: 10.0
  fit_split: train
labels:
  risk_threshold_windows: 3
splits:
  train_days:
  - monday
  - tuesday
  - wednesday
  test_days:
  - friday_morning
  - friday_portscan
  - friday_ddos
  holdout_days:
  - thursday_web
  - thursday_infiltration
  val_fraction_of_train_time: 0.3
  val_block_per_day: true
model:
  n_features: 45
  encoder:
    hidden_size: 128
    num_layers: 2
    dropout: 0.1
  transition:
    mlp_hidden: 256
    logvar_min: -6.0
    logvar_max: 3.0
    state_clamp: 10.0
    linear_skip: true
  risk_head:
    hidden: 64
  stage_head:
    hidden: 64
    n_stages: 6
train_dynamics:
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 256
  epochs: 60
  grad_clip: 1.0
  scheduler: cosine
  early_stopping_metric: val_multistep_nll
  patience: 8
  horizon_discount: 0.85
  teacher_forcing:
    start_p: 1.0
    end_p: 0.3
    anneal_fraction_of_epochs: 0.6
  beta_nll: 0.5
train_heads:
  selection_metric: val_auc_pr_natural
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 256
  epochs: 30
  grad_clip: 1.0
  patience: 6
  risk_sampling: imbalanced
  input_noise: 0.3
ensemble:
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
rollout:
  n_samples_per_member: 200
  stochastic: true
  ci_low_quantile: 0.05
  ci_high_quantile: 0.95
  risk_pooling_method: quantile
  risk_pooling_quantile: 0.85
  risk_pooling_head_reduction: before_pooling
training_data:
  max_train_samples: 500000
  max_val_samples: 50000
serving:
  torch_num_threads: 2
  latency_target_ms: 300
eval:
  risk_threshold: 0.75
  lead_time_persistence_windows: 2
  forecast_chunk_size: 500
  window_seconds: 60
explain:
  shap_background_centroids: 100
  shap_background_source: benign_train
artifacts:
  root: /Users/manteksinghburn/nidra/.claude/worktrees/model-metrics-improvement-c81859/ml/experiments/runs/var_linskip_betanll/artifacts
  weights_dir: /Users/manteksinghburn/nidra/.claude/worktrees/model-metrics-improvement-c81859/ml/experiments/runs/var_linskip_betanll/artifacts/weights
  scaler_dir: /Users/manteksinghburn/nidra/.claude/worktrees/model-metrics-improvement-c81859/ml/experiments/runs/var_linskip_betanll/artifacts/scaler
  metrics_dir: /Users/manteksinghburn/nidra/.claude/worktrees/model-metrics-improvement-c81859/ml/experiments/runs/var_linskip_betanll/artifacts/metrics
  processed_dir: artifacts/processed
